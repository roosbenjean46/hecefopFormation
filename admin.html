<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - HECEFOP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --rouge: #c0392b;
      --rouge-fon: #922b21;
      --jaune: #f1c40f;
      --or: #d4a017;
      --noir: #1a1a2e;
      --noir-clair: #2d2d44;
      --krem: #fdf5e6;
      --blanc: #ffffff;
      --radius: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--krem);
      padding: 40px 20px;
      color: var(--noir);
    }
    .container { max-width: 1000px; margin: 0 auto; }

    .admin-header {
      background: var(--noir);
      color: white;
      padding: 25px 30px;
      border-radius: var(--radius);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 3px solid var(--jaune);
    }
    .admin-header h1 { font-size: 1.8rem; }
    .admin-header h1 i { color: var(--jaune); margin-right: 10px; }
    .admin-header a {
      color: white;
      text-decoration: none;
      background: var(--rouge);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      transition: 0.3s;
    }
    .admin-header a:hover { background: var(--rouge-fon); }

    .admin-section {
      background: white;
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 2px solid var(--krem);
    }
    .admin-section h2 { color: var(--noir); margin-bottom: 5px; font-size: 1.4rem; }
    .admin-section h2 i { color: var(--rouge); }
    .admin-section .sub { color: var(--noir-clair); margin-bottom: 20px; font-size: 0.95rem; }

    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--noir);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--krem);
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--rouge);
      box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.1);
    }
    .form-group textarea { height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .btn-publish {
      padding: 12px 35px;
      background: var(--rouge);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-publish:hover { background: var(--rouge-fon); transform: translateY(-2px); }

    .admin-list .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid var(--krem);
      flex-wrap: wrap;
      gap: 10px;
    }
    .admin-list .item .info { flex: 1; min-width: 150px; }
    .admin-list .item .info strong { display: block; color: var(--noir); }
    .admin-list .item .info small { color: var(--noir-clair); font-size: 0.8rem; }
    .btn-delete {
      padding: 5px 14px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-delete:hover { background: #dc2626; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tabs button {
      padding: 10px 25px;
      background: white;
      border: 2px solid var(--krem);
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
      color: var(--noir-clair);
    }
    .tabs button.active {
      background: var(--rouge);
      color: white;
      border-color: var(--rouge);
    }
    .tabs button:hover:not(.active) { border-color: var(--rouge); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .image-preview {
      max-width: 150px;
      max-height: 100px;
      border-radius: 8px;
      border: 2px solid var(--krem);
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .admin-header { flex-direction: column; text-align: center; }
      .admin-header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="admin-header">
      <h1><i class="fas fa-cog"></i> Administration HECEFOP</h1>
      <a href="index.html"><i class="fas fa-arrow-left"></i> Retour au site</a>
    </div>

    <div class="tabs">
      <button class="active" onclick="switchTab('formations')"><i class="fas fa-calendar-alt"></i> Formations</button>
      <button onclick="switchTab('blog')"><i class="fas fa-pen-fancy"></i> Blog</button>
    </div>

    <!-- ===== TAB FORMATIONS ===== -->
    <div class="tab-content active" id="tab-formations">
      <div class="admin-section">
        <h2><i class="fas fa-plus-circle"></i> Ajouter une formation</h2>
        <p class="sub">Remplissez ce formulaire pour publier une nouvelle formation avec image.</p>
        <form id="formationForm" onsubmit="addFormation(event)">
          <div class="form-row">
            <div class="form-group">
              <label>Titre *</label>
              <input type="text" id="fTitle" placeholder="Ex: Introduction à l'IA" required>
            </div>
            <div class="form-group">
              <label>Date *</label>
              <input type="date" id="fDate" required>
            </div>
          </div>
          <div class="form-group">
            <label>Image (foto) *</label>
            <input type="file" id="fImageFile" accept="image/*" onchange="previewImage(this, 'fPreview')">
            <div id="fPreview" style="margin-top: 8px;"></div>
            <input type="hidden" id="fImage">
          </div>
          <div class="form-group">
            <label>Description *</label>
            <textarea id="fDescription" placeholder="Décrivez la formation..." required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Tags (séparés par des virgules)</label>
              <input type="text" id="fTags" placeholder="IA, ChatGPT, Automatisation">
            </div>
            <div class="form-group">
              <label>Statut</label>
              <select id="fStatus">
                <option value="upcoming">À venir</option>
                <option value="past">Passée</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Lien Google Meet (pour formations à venir)</label>
            <input type="text" id="fLink" placeholder="https://meet.google.com/abc-defg-hij">
          </div>
          <button type="submit" class="btn-publish"><i class="fas fa-upload"></i> Publier la formation</button>
        </form>
      </div>

      <div class="admin-section">
        <h2><i class="fas fa-list"></i> Formations existantes</h2>
        <div class="admin-list" id="formationList"></div>
      </div>
    </div>

    <!-- ===== TAB BLOG ===== -->
    <div class="tab-content" id="tab-blog">
      <div class="admin-section">
        <h2><i class="fas fa-plus-circle"></i> Ajouter un article</h2>
        <p class="sub">Remplissez ce formulaire pour publier un nouvel article de blog avec image.</p>
        <form id="blogForm" onsubmit="addBlog(event)">
          <div class="form-group">
            <label>Titre *</label>
            <input type="text" id="bTitle" placeholder="Ex: Les tendances 2026" required>
          </div>
          <div class="form-group">
            <label>Date *</label>
            <input type="date" id="bDate" required>
          </div>
          <div class="form-group">
            <label>Image (foto) *</label>
            <input type="file" id="bImageFile" accept="image/*" onchange="previewImage(this, 'bPreview')">
            <div id="bPreview" style="margin-top: 8px;"></div>
            <input type="hidden" id="bImage">
          </div>
          <div class="form-group">
            <label>Résumé (extrait) *</label>
            <textarea id="bExcerpt" placeholder="Un court résumé de l'article..." required></textarea>
          </div>
          <div class="form-group">
            <label>Contenu complet *</label>
            <textarea id="bContent" placeholder="Le contenu complet de l'article..." style="height:150px;" required></textarea>
          </div>
          <div class="form-group">
            <label>Tags (séparés par des virgules)</label>
            <input type="text" id="bTags" placeholder="Technologie, IA, Formation">
          </div>
          <button type="submit" class="btn-publish"><i class="fas fa-upload"></i> Publier l'article</button>
        </form>
      </div>

      <div class="admin-section">
        <h2><i class="fas fa-list"></i> Articles existants</h2>
        <div class="admin-list" id="blogList"></div>
      </div>
    </div>

  </div>

  <script>
    let formationIdCounter = 100;
    let blogIdCounter = 100;

    // ===== PREVIEW IMAGE =====
    function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      const hiddenInput = input.parentElement.querySelector('input[type="hidden"]');
      
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" class="image-preview">`;
          hiddenInput.value = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      } else {
        preview.innerHTML = '';
        hiddenInput.value = '';
      }
    }

    // ===== CHARGER LES DONNÉES =====
    function loadFormations() {
      const data = JSON.parse(localStorage.getItem('hecefop_formations') || '[]');
      const list = document.getElementById('formationList');
      if (data.length === 0) {
        list.innerHTML = '<p style="color: var(--noir-clair);">Aucune formation enregistrée.</p>';
        return;
      }
      list.innerHTML = data.map(f => `
        <div class="item">
          <div class="info">
            <strong>${f.title_fr}</strong>
            <small>${new Date(f.date).toLocaleDateString('fr-FR')} - ${f.status === 'upcoming' ? 'À venir' : 'Passée'}</small>
            ${f.image ? `<small>📷 Image incluse</small>` : ''}
          </div>
          <button class="btn-delete" onclick="deleteFormation(${f.id})"><i class="fas fa-trash"></i> Supprimer</button>
        </div>
      `).join('');
    }

    function loadBlogs() {
      const data = JSON.parse(localStorage.getItem('hecefop_blogs') || '[]');
      const list = document.getElementById('blogList');
      if (data.length === 0) {
        list.innerHTML = '<p style="color: var(--noir-clair);">Aucun article enregistré.</p>';
        return;
      }
      list.innerHTML = data.map(b => `
        <div class="item">
          <div class="info">
            <strong>${b.title_fr}</strong>
            <small>${new Date(b.date).toLocaleDateString('fr-FR')}</small>
            ${b.image ? `<small>📷 Image incluse</small>` : ''}
          </div>
          <button class="btn-delete" onclick="deleteBlog(${b.id})"><i class="fas fa-trash"></i> Supprimer</button>
        </div>
      `).join('');
    }

    // ===== AJOUTER UNE FORMATION =====
    function addFormation(e) {
      e.preventDefault();
      const title = document.getElementById('fTitle').value;
      const date = document.getElementById('fDate').value;
      const image = document.getElementById('fImage').value;
      const description = document.getElementById('fDescription').value;
      const tags = document.getElementById('fTags').value.split(',').map(t => t.trim()).filter(t => t);
      const status = document.getElementById('fStatus').value;
      const link = document.getElementById('fLink').value;

      if (!title || !date || !description) {
        alert('Veuillez remplir tous les champs obligatoires (*)');
        return;
      }

      if (!image) {
        alert('Veuillez choisir une image pour la formation.');
        return;
      }

      const formations = JSON.parse(localStorage.getItem('hecefop_formations') || '[]');
      formations.push({
        id: formationIdCounter++,
        title_fr: title,
        title_en: title,
        date: date,
        description_fr: description,
        description_en: description,
        image: image,
        tags_fr: tags.length > 0 ? tags : ['Formation'],
        tags_en: tags.length > 0 ? tags : ['Training'],
        status: status,
        link: link || ''
      });
      localStorage.setItem('hecefop_formations', JSON.stringify(formations));
      document.getElementById('formationForm').reset();
      document.getElementById('fPreview').innerHTML = '';
      loadFormations();
      alert('✅ Formation publiée avec succès !');
    }

    // ===== AJOUTER UN BLOG =====
    function addBlog(e) {
      e.preventDefault();
      const title = document.getElementById('bTitle').value;
      const date = document.getElementById('bDate').value;
      const image = document.getElementById('bImage').value;
      const excerpt = document.getElementById('bExcerpt').value;
      const content = document.getElementById('bContent').value;
      const tags = document.getElementById('bTags').value.split(',').map(t => t.trim()).filter(t => t);

      if (!title || !date || !excerpt || !content) {
        alert('Veuillez remplir tous les champs obligatoires (*)');
        return;
      }

      if (!image) {
        alert('Veuillez choisir une image pour l\'article.');
        return;
      }

      const blogs = JSON.parse(localStorage.getItem('hecefop_blogs') || '[]');
      blogs.push({
        id: blogIdCounter++,
        title_fr: title,
        title_en: title,
        date: date,
        image: image,
        excerpt_fr: excerpt,
        excerpt_en: excerpt,
        content_fr: content,
        content_en: content,
        tags_fr: tags.length > 0 ? tags : ['Article'],
        tags_en: tags.length > 0 ? tags : ['Article']
      });
      localStorage.setItem('hecefop_blogs', JSON.stringify(blogs));
      document.getElementById('blogForm').reset();
      document.getElementById('bPreview').innerHTML = '';
      loadBlogs();
      alert('✅ Article publié avec succès !');
    }

    // ===== SUPPRIMER =====
    function deleteFormation(id) {
      if (!confirm('Supprimer cette formation ?')) return;
      let data = JSON.parse(localStorage.getItem('hecefop_formations') || '[]');
      data = data.filter(f => f.id !== id);
      localStorage.setItem('hecefop_formations', JSON.stringify(data));
      loadFormations();
    }

    function deleteBlog(id) {
      if (!confirm('Supprimer cet article ?')) return;
      let data = JSON.parse(localStorage.getItem('hecefop_blogs') || '[]');
      data = data.filter(b => b.id !== id);
      localStorage.setItem('hecefop_blogs', JSON.stringify(data));
      loadBlogs();
    }

    // ===== TABS =====
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'formations') loadFormations();
      else loadBlogs();
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
      const f = JSON.parse(localStorage.getItem('hecefop_formations') || '[]');
      if (f.length > 0) formationIdCounter = Math.max(...f.map(i => i.id)) + 1;
      const b = JSON.parse(localStorage.getItem('hecefop_blogs') || '[]');
      if (b.length > 0) blogIdCounter = Math.max(...b.map(i => i.id)) + 1;
      loadFormations();
      loadBlogs();
    });
  </script>

</body>
</html>
